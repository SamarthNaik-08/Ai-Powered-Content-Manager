spring:
  application:
    name: ai-powered-content-manager-backend
  profiles:
    active: local
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 25
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  cache:
    type: ${CACHE_TYPE:simple}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  servlet:
    context-path: /

# JWT Configuration
app:
  jwt:
    # Base64-encoded 256-bit secret key for HMAC-SHA256 (default for dev/local)
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    access-token-expiration-ms: ${JWT_ACCESS_EXPIRATION_MS:900000} # 15 minutes (15 * 60 * 1000)
    refresh-token-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000} # 7 days (7 * 24 * 60 * 60 * 1000)
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
  ai:
    provider: ${AI_PROVIDER:mock} # mock, openai, gemini
    model: ${AI_MODEL:gpt-4o-mini}
    api-key: ${AI_API_KEY:}
    api-url: ${AI_API_URL:https://api.openai.com/v1}
    timeout-seconds: ${AI_TIMEOUT_SECONDS:30}
    limits:
      default-daily-limit: 50
      role-daily-limits:
        ROLE_ADMIN: 500
        ROLE_EDITOR: 200
        ROLE_AUTHOR: 50
        ROLE_VIEWER: 0
  media:
    upload-dir: ${MEDIA_UPLOAD_DIR:./uploads}
    max-file-size-bytes: 10485760 # 10MB
    allowed-mime-types:
      - image/jpeg
      - image/png
      - image/webp
      - image/gif
      - image/svg+xml
      - application/pdf
      - text/plain
      - text/markdown

# Springdoc OpenAPI / Swagger UI
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true
