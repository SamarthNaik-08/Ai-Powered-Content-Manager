name: CI / Production Readiness Verification

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-verify:
    name: Backend Build, Tests & Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17 (Eclipse Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Compile and Run Backend Unit & Integration Tests
        run: mvn -B clean verify
        working-directory: backend

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: backend/target/surefire-reports/
          retention-days: 7

  frontend-verify:
    name: Frontend Typecheck & Production Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: npm ci
        working-directory: frontend

      - name: Verify TypeScript Type-Safety
        run: npx tsc --noEmit
        working-directory: frontend

      - name: Build Optimized Production Bundle
        run: npm run build
        working-directory: frontend

      - name: Upload Production Bundle Artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 7

  docker-compose-validate:
    name: Docker Configuration & Image Builds
    runs-on: ubuntu-latest
    needs: [backend-verify, frontend-verify]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate Docker Compose Configuration
        run: docker compose config
        env:
          DB_PASSWORD: postgres
          JWT_SECRET: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970

      - name: Build Backend Docker Image
        run: docker build -t content-manager-backend:ci ./backend

      - name: Build Frontend Docker Image
        run: docker build -t content-manager-frontend:ci ./frontend
